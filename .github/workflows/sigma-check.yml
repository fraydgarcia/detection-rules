name: sigma check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar sigma-cli
        run: pip install sigma-cli pySigma-backend-elasticsearch
      - name: Validar reglas
        run: sigma check --fail-on-error --fail-on-issues rules/
      - name: Convertir a Lucene
        run: sigma convert -t lucene --without-pipeline rules/
